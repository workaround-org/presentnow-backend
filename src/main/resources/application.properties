#
# HTTP
quarkus.http.root-path=/api/present-now/v1
#
# Postgres
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod,dev.quarkus.flyway.migrate-at-start=true
%prod,dev.quarkus.hibernate-orm.schema-management.strategy=none
#
# Test
%test.quarkus.flyway.enabled=false
%test.quarkus.native.resources.includes=import.sql
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql
#
# OIDC
quarkus.oidc.auth-server-url=https://workaround-org.eu.auth0.com
quarkus.oidc.client-id=JhZPpIMYwq6gKnqzbH7ndtU9FyunibwW
quarkus.oidc.token.verify-access-token-with-user-info=true
#quarkus.oidc.authentication.scopes=profile
#
# Permissions
quarkus.http.auth.permission.secured.paths=${quarkus.http.root-path}/*
quarkus.http.auth.permission.secured.policy=authenticated
quarkus.http.auth.permission.public.paths=${quarkus.http.root-path}/public/*
quarkus.http.auth.permission.public.policy=permit
%dev.quarkus.http.auth.permission.devui.paths=${quarkus.http.root-path}/q/*
%dev.quarkus.http.auth.permission.devui.policy=permit
quarkus.datasource.devservices.port=5432
#
# Prod
%prod.quarkus.management.enabled=true