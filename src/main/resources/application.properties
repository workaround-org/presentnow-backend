#
# HTTP
quarkus.http.root-path=/api/present-now/v1
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=*
#
# Postgres
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod,dev.quarkus.flyway.migrate-at-start=true
%prod,dev.quarkus.hibernate-orm.schema-management.strategy=none
#
# Test
%test.quarkus.flyway.enabled=false
%test.quarkus.native.resources.includes=import.sql,jwt-test/*.pem
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql
#
# OIDC
quarkus.oidc.auth-server-url=https://workaround-org.eu.auth0.com
quarkus.oidc.client-id=JhZPpIMYwq6gKnqzbH7ndtU9FyunibwW
#quarkus.oidc.token.verify-access-token-with-user-info=true
#quarkus.oidc.authentication.scopes=profile
#
# Magic link auth
com.github.presentnow.auth.issuer=https://presentnow.app
com.github.presentnow.auth.cookie-name=presentnow_session
com.github.presentnow.auth.magic-link-expiry-minutes=15
com.github.presentnow.auth.session-expiry-days=7
com.github.presentnow.auth.frontend-url=https://presentnow.app
%dev.com.github.presentnow.auth.frontend-url=http://localhost:5173
#
# SmallRye JWT (magic link session) - cookie transport avoids clash with OIDC bearer
mp.jwt.verify.issuer=${com.github.presentnow.auth.issuer}
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=${com.github.presentnow.auth.cookie-name}
%dev.mp.jwt.verify.publickey.location=jwt-dev/publicKey.pem
%dev.smallrye.jwt.sign.key.location=jwt-dev/privateKey.pem
%test.mp.jwt.verify.publickey.location=jwt-test/publicKey.pem
%test.smallrye.jwt.sign.key.location=jwt-test/privateKey.pem
#
# Mailer (mock is only automatic in dev/test launch mode, not in a packaged
# app running with the test profile, so integration tests need it explicit)
quarkus.mailer.from=no-reply@presentnow.app
%test.quarkus.mailer.mock=true
%prod.quarkus.mailer.host=${SMTP_HOST}
%prod.quarkus.mailer.port=${SMTP_PORT:587}
%prod.quarkus.mailer.username=${SMTP_USER}
%prod.quarkus.mailer.password=${SMTP_PASSWORD}
%prod.quarkus.mailer.start-tls=REQUIRED
#
# Permissions
quarkus.http.auth.permission.secured.paths=${quarkus.http.root-path}/*
quarkus.http.auth.permission.secured.policy=authenticated
quarkus.http.auth.permission.public.paths=${quarkus.http.root-path}/public/*
quarkus.http.auth.permission.public.policy=permit
%dev.quarkus.http.auth.permission.devui.paths=${quarkus.http.root-path}/q/*
%dev.quarkus.http.auth.permission.devui.policy=permit
quarkus.datasource.devservices.port=5432
#
# Prod
%prod.quarkus.management.enabled=true
quarkus.banner.path=banner.txt
com.github.presentnow.audience=https://workaround-org.eu.auth0.com/api/v2/
com.github.presentnow.searchengine=https://www.google.com/search?q=